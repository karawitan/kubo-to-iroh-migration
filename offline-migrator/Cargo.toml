[package]
name = "iroh-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
iroh-base = { version = "0.28", features = ["redb"] }
bao-tree = { version = "0.13", default-features = false }
redb = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
mongodb = "2"
futures = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc", "use-std", "experimental-derive"] }
bs58 = "0.5"
hex = "0.4"
chrono = "0.4"
crossbeam-channel = "0.5"
